{{- $secretName := printf "%s-auth" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $username := randAlphaNum 12 -}}
{{- $password := randAlphaNum 32 -}}

{{- if $existing -}}
{{- $username = required "Secret nema username" (index $existing.data "username") | b64dec -}}
{{- $password = required "Secret nema password" (index $existing.data "password") | b64dec -}}
{{- end -}}

{{- $mongoURL := printf "mongodb://%s:%s@%s:%v/?authSource=admin" $username $password .Release.Name .Values.service.port -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  username: {{ $username | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  mongo-url: {{ $mongoURL | b64enc | quote }}
