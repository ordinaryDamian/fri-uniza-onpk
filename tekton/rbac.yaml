apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasklist-pipeline
  namespace: tasklist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasklist-pipeline
  namespace: tasklist
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasklist-pipeline
  namespace: tasklist
subjects:
  - kind: ServiceAccount
    name: tasklist-pipeline
    namespace: tasklist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tasklist-pipeline
